<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D 지구</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  background:radial-gradient(ellipse at 50% 38%,#1b3a72 0%,#0c1d44 50%,#050c22 100%);
  font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:16px;top:14px;display:flex;gap:12px;align-items:center;z-index:2}
#exit{display:none;border:0;border-radius:22px;padding:10px 18px;font-size:16px;font-weight:700;color:#173064;
  background:linear-gradient(#fff,#dfe8ff);box-shadow:0 3px 10px #0007}
#title{font-weight:800;font-size:19px;text-shadow:0 2px 8px #000a}
__TABS__
#panel{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:center;
  max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 18px;border-radius:24px;background:#13285acc;box-shadow:0 3px 10px #0007;font-size:15px;font-weight:700;color:#dfe8ff;z-index:2}
#panel label{display:flex;align-items:center;gap:8px;white-space:nowrap}
#panel input[type=checkbox]{width:20px;height:20px}
#panel input[type=range]{width:120px}
#panel button{border:0;border-radius:18px;padding:8px 14px;font:inherit;color:#173064;background:linear-gradient(#fff,#dfe8ff)}
#hint{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);font-size:14px;opacity:.75;white-space:nowrap;transition:opacity 1s;text-shadow:0 1px 4px #000}
#fps{position:fixed;right:12px;bottom:10px;font:12px monospace;opacity:.55;z-index:3}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.7}
/* 천문대 말풍선(지도 말풍선과 같은 모양, 테두리는 천문대 민트) */
#obsTag{position:fixed;left:0;top:0;z-index:2;display:none;padding:.55em 1.1em .5em;border-radius:1.3em;font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;
  color:#1f3f4a;background:linear-gradient(180deg,#fff 0%,#eefbf7 100%);border:3px solid #4fc7b2;cursor:pointer;
  filter:drop-shadow(0 4px 0 #2a9483) drop-shadow(0 8px 12px rgba(0,0,20,.45));transform:translate(-50%,-100%);will-change:left,top,opacity}
#obsTag::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;margin-left:-8px;background:#eefbf7;border:solid #4fc7b2;border-width:0 3px 3px 0;
  border-bottom-right-radius:3px;transform:rotate(45deg);clip-path:polygon(100% -20%,100% 100%,-20% 100%)}
#obsTag:active{filter:drop-shadow(0 1px 0 #2a9483) drop-shadow(0 4px 8px rgba(0,0,20,.45))}
/* 천문대 확대 보기 */
#focusUI{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:10px;z-index:2}
#focusUI .say{font-size:16px;font-weight:700;text-shadow:0 2px 6px #000c;white-space:nowrap}
#focusUI button{border:0;border-radius:22px;padding:10px 20px;font-size:16px;font-weight:700;color:#173064;background:linear-gradient(#fff,#dfe8ff);box-shadow:0 3px 10px #0007}
body.focus #panel,body.focus #hint,body.focus #tabs{display:none!important}
body.focus #focusUI{display:flex}
/* 우주 천문대 콘텐츠 창 */
#uni{position:fixed;inset:0;z-index:20;display:none;background:#050c22}
#uni iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050c22}
#uni .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;opacity:.75}
#uniClose{position:absolute;left:16px;top:14px;z-index:2;border:0;border-radius:22px;padding:10px 18px;font-size:16px;font-weight:700;color:#173064;background:linear-gradient(#fff,#dfe8ff);box-shadow:0 3px 10px #0007}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="exit">← 나가기</button><div id="title">위티버스 3D 지구</div></div>
<div id="tabs">__TABLINKS__</div>
<div id="hint">한 손가락으로 지구를 굴리고, 두 손가락으로 돌리거나 확대해 보세요</div>
<div id="fps"></div>
<div id="load">지구 불러오는 중…</div>
<div id="obsTag">우주 천문대</div>
<div id="focusUI"><div class="say">천문대를 눌러 우주로 가볼까요?</div><button id="focusBack">← 지구로</button></div>
<div id="uni"><div class="msg">우주 천문대 불러오는 중…</div><button id="uniClose">✕ 닫기</button></div>
<div id="panel">
  <label>회전 속도 <input type="range" id="speed" min="0" max="100" value="12"></label>
  <label><input type="checkbox" id="trees3d" checked> 3D 나무</label>
  <label><input type="checkbox" id="build3d" checked> 3D 건물·지형</label>
  <label><input type="checkbox" id="props"> 그림 물체</label>
  <label><input type="checkbox" id="clouds" checked> 구름</label>
  <button id="reset">처음 위치</button>
</div>
<script>__THREE__</script>
<script>window.ASSETS = __ASSETS__;</script>
<script>
(async () => {


const A = window.ASSETS;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, preserveDrawingBuffer:true});
const BASE_PR = Math.min(devicePixelRatio, __PR__, 1.25);   // 기본 렌더 해상도 상한 1.25배(지구가 GPU 한계에 가까워, 더 높으면 프레임이 들쭉날쭉)
renderer.setPixelRatio(BASE_PR);
// 확대해서 지구가 화면을 꽉 채우면 픽셀 계산량이 커지므로, 확대 정도에 따라 렌더 해상도를 단계적으로 낮춤
let curPR = BASE_PR;
function applyPR(){
  const k = camDist > 4.5 ? 1 : camDist > 3.6 ? 0.88 : 0.75;
  const pr = Math.max(1, BASE_PR*k);
  if (Math.abs(pr - curPR) > 0.01){ curPR = pr; renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight, false); }
}
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const CAM0 = new THREE.Vector3(0, 0.45, 5.6);
camera.position.copy(CAM0);
const TARGET = new THREE.Vector3(0,-0.12,0);
camera.lookAt(TARGET);
let camDist = CAM0.distanceTo(TARGET);

const loader = new THREE.TextureLoader();
const load = (src) => new Promise(r => loader.load(src, t => { t.anisotropy = 8; r(t); }));

// 축 기울기를 준 회전축 그룹
// 드래그 회전 그룹(카메라 고정, 지구 자체를 굴림)
const drag = new THREE.Group(); scene.add(drag);
{ const el=+(new URLSearchParams(location.search).get('el')||0); if(el) drag.rotation.x = THREE.MathUtils.degToRad(el); }
const tilt = new THREE.Group(); tilt.rotation.z = THREE.MathUtils.degToRad(-12); drag.add(tilt);
const spin = new THREE.Group(); tilt.add(spin);
spin.rotation.y = -Math.PI/2 + THREE.MathUtils.degToRad(+(new URLSearchParams(location.search).get('rot')||0));

const DISP = 0.03;
const LIGHT = new THREE.Vector3(-0.55, 0.75, 0.6).normalize();

const tex = await load(A.tex);
tex.wrapS = THREE.RepeatWrapping; tex.minFilter = THREE.LinearMipmapLinearFilter;

const globeMat = new THREE.ShaderMaterial({
  uniforms:{ map:{value:tex}, wTex:{value:null}, uTime:{value:0}, uLight:{value:LIGHT}, uDisp:{value:DISP}, uBump:{value:0.034}, uModel:{value:new THREE.Matrix4()}, uZoom:{value:0} },
  vertexShader:`
    uniform sampler2D map; uniform float uDisp;
    varying vec2 vUv; varying vec3 vWPos;
    void main(){
      vUv = uv;
      float h = texture2D(map, uv).b;
      vec3 p = position * (1.0 + uDisp*h);
      vec4 w = modelMatrix * vec4(p,1.0);
      vWPos = w.xyz;
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader:`
    uniform sampler2D map; uniform vec3 uLight; uniform float uBump; uniform mat4 uModel; uniform float uTime; uniform float uZoom;
    varying vec2 vUv; varying vec3 vWPos;
    // 가까이서 보는 잔디 결: 지구 표면에 붙은 3D 값 노이즈(멀리서는 계산하지 않음)
    float hash3(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
    float vnoise(vec3 p){
      vec3 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);
      float a = mix(mix(hash3(i), hash3(i+vec3(1,0,0)), f.x), mix(hash3(i+vec3(0,1,0)), hash3(i+vec3(1,1,0)), f.x), f.y);
      float b = mix(mix(hash3(i+vec3(0,0,1)), hash3(i+vec3(1,0,1)), f.x), mix(hash3(i+vec3(0,1,1)), hash3(i+vec3(1,1,1)), f.x), f.y);
      return mix(a, b, f.z);
    }
    // 바다 잔물결: 미리 만든 이음매 없는 노이즈 텍스처(R,G=기울기, B=높이) 두 겹을 다른 방향으로 흘림
    uniform sampler2D wTex;
    float waves(vec2 w, out vec2 g){
      vec4 a = texture2D(wTex, w + vec2(uTime*0.011, uTime*0.007));
      vec4 b = texture2D(wTex, w*1.9 + vec2(-uTime*0.014, uTime*0.010));
      g = (a.rg-0.5)*0.65 + (b.rg-0.5)*0.35*1.9;
      return ((a.b-0.5)*0.65 + (b.b-0.5)*0.35)*3.0;
    }
    // 극지방용 단순 잔물결: 텍스처 한 겹만
    float waves1(vec2 w, out vec2 g){
      vec4 a = texture2D(wTex, w + vec2(uTime*0.011, uTime*0.007));
      g = (a.rg-0.5)*0.9;
      return (a.b-0.5)*2.4;
    }
    const float PI = 3.14159265;
    float H(vec2 uv){ return texture2D(map, uv).b; }
    // 먼바다 물결선: 칸마다 일부에만 짧은 "∼" 선이 나타나 선과 수직 방향(앞)으로 밀려가다 사라짐
    // g = 칸 좌표(1칸 ≈ 10°), sx = 가로 늘림 보정, salt = 좌표계마다 다른 무작위값
    float marks(vec2 g, float sx, float salt){
      g.y += fract(sin(floor(g.x)*91.7 + salt)*4375.85);         // 세로줄마다 위아래로 어긋나게(가로 일렬 방지)
      vec2 id = floor(g), f = fract(g) - 0.5;
      float h = fract(sin(dot(id, vec2(127.1,311.7)) + salt)*43758.5453);
      if (h > 0.2) return 0.0;                                   // 약 20% 칸에만
      float life = fract(uTime*0.16 + h*13.0);                   // 칸마다 다른 주기로 나타났다 사라짐
      float len = mix(0.12, 0.40, fract(h*53.1));                // 물결선 반쪽 길이(칸마다 무작위)
      vec2 p = f - (vec2(fract(h*91.3), fract(h*37.7)) - 0.5)*vec2(0.92 - 2.0*len, 0.18);   // 칸 밖으로 잘리지 않는 범위에서 위치
      p.y -= (life - 0.5)*0.46;                                  // 사는 동안 앞으로 전진
      p.x *= sx;
      float y = 0.055*sin(p.x*15.0 + h*20.0);
      float line = smoothstep(0.032, 0.012, abs(p.y - y)) * smoothstep(len, len - 0.09, abs(p.x));
      return line * smoothstep(0.0, 0.25, life) * smoothstep(1.0, 0.7, life);
    }
    // 위도 49° 아래는 지도 좌표 칸, 53° 위는 극점을 내려다본 평면 칸, 사이는 섞음
    float waveMarks(vec2 uv, vec3 N){
      float lat = abs((uv.y-0.5)*PI), w = smoothstep(0.855, 0.925, lat), m = 0.0;
      if (w < 1.0) m += (1.0-w) * marks(vec2(uv.x*36.0, uv.y*18.0), mix(1.0, 1.0/max(cos(lat),0.5), 0.6), 0.0);
      if (w > 0.0) m += w * marks(N.xz/(1.0+abs(N.y))*11.5, 1.0, N.y > 0.0 ? 3.7 : 8.1);
      return m;
    }
    void main(){
      vec4 t = texture2D(map, vUv);
      float L = t.r, T = t.g, h = t.b, nearC = t.a;
      float phi = vUv.x*2.0*PI, th = (1.0-vUv.y)*PI;
      float st = max(sin(th), 0.15);
      vec3 N = vec3(-cos(phi)*sin(th), cos(th), sin(phi)*sin(th));
      vec3 E = normalize(vec3(sin(phi), 0.0, cos(phi)));
      vec3 No = vec3(cos(phi)*cos(th), sin(th), -sin(phi)*cos(th));
      vec2 d = vec2(1.0/2048.0, 1.0/1024.0);
      float dHdE = (H(vUv+vec2(d.x,0.)) - H(vUv-vec2(d.x,0.))) / (2.0*d.x*2.0*PI*st);
      float dHdN = (H(vUv+vec2(0.,d.y)) - H(vUv-vec2(0.,d.y))) / (2.0*d.y*PI);
      vec3 n = normalize(N - uBump*(dHdE*E + dHdN*No));
      vec2 wg = vec2(0.0); float wv = 0.0;
      if (t.r < 0.99){                                  // 육지 픽셀은 물결 계산 생략(성능)
        // 지도 좌표로 입히면 극점에서 무늬가 한 점으로 모이므로, 극지방은 내려다본 평면 좌표로 입히고 경계는 섞음
        float pw = smoothstep(0.855, 0.925, abs((vUv.y-0.5)*PI));   // 위도 49~53°에서만 섞음
        vec3 gw = vec3(0.0);
        if (pw < 1.0){ wv += (1.0-pw)*waves(vUv*vec2(12.0,6.0), wg); gw += (1.0-pw)*(wg.x*E + wg.y*No); }
        if (pw > 0.0){ wv += pw*waves1(N.xz/(1.0+abs(N.y))*3.8 + (N.y > 0.0 ? 0.0 : 0.5), wg); vec3 gp = vec3(wg.x,0.0,wg.y); gw += pw*(gp - N*dot(gp,N)); }
        n = normalize(n - gw*0.16*(1.0-t.r));          // 바다만 잔물결로 법선 흔들기
      }
      mat3 R = mat3(uModel);
      vec3 nw = normalize(R*n);
      vec3 Nw = normalize(R*N);
      vec3 V = normalize(cameraPosition - vWPos);

      vec3 ocean = vec3(0.04,0.60,0.98);
      vec3 oceanDeep = vec3(0.01,0.45,0.90);
      float coast = nearC * nearC;
      ocean = mix(ocean, oceanDeep, coast*0.9);
      vec3 land = mix(vec3(0.40,0.87,0.21), vec3(0.76,0.93,0.20), T);
      land *= mix(0.84, 1.0, smoothstep(0.0, 0.85, h));   // 해안 쪽이 살짝 어두운 볼록감
      if (uZoom > 0.01 && L > 0.01){                       // 확대할수록: 톤을 낮추고(채도 -22%, 밝기 -14%) 잔디 결을 섞어 넓은 단색 면을 깸
        float g = dot(land, vec3(0.299, 0.587, 0.114));
        land = mix(land, mix(vec3(g), land, 0.78) * 0.86, uZoom);
        float n1 = vnoise(N*70.0), n2 = vnoise(N*230.0 + 7.3);
        float grass = (n1 - 0.5)*0.7 + (n2 - 0.5)*0.45;
        land *= 1.0 + grass*0.32*uZoom;
        land = mix(land, land*vec3(0.92, 1.0, 1.06), clamp(-grass*1.6, 0.0, 1.0)*uZoom);   // 어두운 결은 살짝 푸른 초록
        land = mix(land, land*vec3(1.06, 1.02, 0.9), clamp(grass*1.6, 0.0, 1.0)*uZoom);    // 밝은 결은 살짝 노란 연두
      }
      // 해안 파도: 바다 쪽에서 해안으로 밀려오는 하얀 물결 줄(잔물결로 끊어지게)
      float band = 0.5 + 0.5*sin(nearC*11.0 - uTime*1.5 + wv*0.9);
      float foam = smoothstep(0.55, 1.0, band) * smoothstep(0.08, 0.6, nearC) * (1.0-L) * 0.55;
      foam += smoothstep(0.85, 1.0, nearC) * (1.0-L) * (0.45 + 0.25*sin(uTime*2.0 + wv*2.0));   // 해안선에 닿는 거품
      ocean += vec3(0.04,0.06,0.07) * wv * (1.0-coast);                                          // 먼바다 은은한 일렁임
      ocean = mix(ocean, vec3(0.86,0.96,1.0), clamp(foam,0.0,1.0)*0.45);
      float mk = waveMarks(vUv, N) * (1.0-L) * (1.0 - smoothstep(0.05, 0.35, nearC));   // 해안 가까이는 제외
      ocean = mix(ocean, vec3(0.92,0.98,1.0), mk*0.75);
      vec3 alb = mix(ocean, land, L);

      float ndl = dot(nw, uLight);
      float diff = 0.5 + 0.5*ndl;                 // 부드러운 감싸기 조명
      vec3 col = alb * (0.70 + 0.40*diff);
      // 아래쪽 은은한 하늘색 반사광
      col += alb * vec3(0.10,0.18,0.25) * max(0.0, -nw.y);
      vec3 Hv = normalize(uLight + V);
      // 광원 반사: 또렷한 동그라미 대신 넓게 번지는 은은한 빛
      float nh = max(dot(Nw,Hv),0.0);
      float spec = pow(nh, 6.0) * mix(0.16, 0.10, L);
      spec += pow(max(dot(nw,Hv),0.0), 14.0) * mix(0.05, 0.03, L);
      col += vec3(spec);
      float fres = pow(1.0 - max(dot(Nw, V), 0.0), 3.0);
      col += mix(vec3(0.45,0.80,1.0), vec3(0.55,0.95,0.45), L) * fres * mix(0.55, 0.30, L);
      gl_FragColor = vec4(col, 1.0);
    }`
});
// 물결 텍스처: 이음매 없는(주기적) 경사 노이즈 3옥타브 -> R,G=기울기, B=높이
globeMat.uniforms.wTex.value = (() => {
  const S = 256, h = new Float32Array(S*S);
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  for (const [P, amp] of [[8,0.6],[16,0.28],[32,0.12]]){
    const gx = new Float32Array(P*P), gy = new Float32Array(P*P);
    for (let i=0;i<P*P;i++){ const a = rnd()*Math.PI*2; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
    const dot = (ix,iy,fx,fy) => { const k = ((iy%P+P)%P)*P + ((ix%P+P)%P); return gx[k]*fx + gy[k]*fy; };
    const fade = t => t*t*t*(t*(t*6-15)+10);
    for (let y=0;y<S;y++) for (let x=0;x<S;x++){
      const px = x/S*P, py = y/S*P, ix = Math.floor(px), iy = Math.floor(py), fx = px-ix, fy = py-iy, u = fade(fx), v = fade(fy);
      const n0 = dot(ix,iy,fx,fy) + u*(dot(ix+1,iy,fx-1,fy) - dot(ix,iy,fx,fy));
      const n1 = dot(ix,iy+1,fx,fy-1) + u*(dot(ix+1,iy+1,fx-1,fy-1) - dot(ix,iy+1,fx,fy-1));
      h[y*S+x] += amp*(n0 + v*(n1-n0));
    }
  }
  const d = new Uint8Array(S*S*4), at = (x,y) => h[((y+S)%S)*S + (x+S)%S];
  for (let y=0;y<S;y++) for (let x=0;x<S;x++){
    const i = (y*S+x)*4, dx = (at(x+1,y)-at(x-1,y))*S*0.05, dy = (at(x,y+1)-at(x,y-1))*S*0.05;
    d[i] = Math.max(0,Math.min(255,128+dx*127)); d[i+1] = Math.max(0,Math.min(255,128+dy*127)); d[i+2] = Math.max(0,Math.min(255,128+at(x,y)*180)); d[i+3] = 255;
  }
  const t = new THREE.DataTexture(d, S, S); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; t.needsUpdate = true;
  return t;
})();

// (말풍선은 천문대 꼭대기가 카메라를 향하는 정도 0.12~0.35 에서 나타남 — placeTag 와 같은 기준, 0.2 를 넘는 순간을 찾음)
if (!new URLSearchParams(location.search).get('rot')){
  const top = latLonToLocal(OB.lat, OB.lon, 1 + DISP + 0.12*0.92), v = new THREE.Vector3(), nrm = new THREE.Vector3(), c = new THREE.Vector3();
  const face = (ang) => { spin.rotation.y = ang; scene.updateMatrixWorld(); v.copy(top).applyMatrix4(globe.matrixWorld); nrm.copy(v).normalize();
    return nrm.dot(c.copy(CAM0).sub(v).normalize()); };
  let appear = null, prev = face(0);
  for (let i = 1; i <= 1440 && appear === null; i++){ const ang = i/1440*Math.PI*2, f = face(ang); if (prev < 0.2 && f >= 0.2) appear = ang; prev = f; }   // 회전 방향(+)으로 돌며 처음 넘는 각
  spin.rotation.y = (appear ?? 0) - speed*0.6*1.2;   // 회전 = dt × speed × 0.6 (frame 참고) → 첫 화면 그리는 시간 포함 약 1.5~2초 뒤 말풍선
}
const START_SPIN = spin.rotation.y;   // "처음 위치" 버튼이 돌아갈 각도
$('speed').oninput = e => speed = e.target.value/100;
$('props').onchange = e => props.visible = e.target.checked;
$('trees3d').onchange = e => treesG.visible = e.target.checked;
$('build3d').onchange = e => { buildG.visible = landG.visible = e.target.checked; };
$('clouds').onchange = e => clouds.visible = e.target.checked;
$('reset').onclick = () => { if (focus) return unfocusObs(); spin.rotation.y = START_SPIN; drag.quaternion.identity(); vel.set(0,0); rimVel = 0; camDist = CAM0.distanceTo(TARGET); placeCam(); };

// 드래그: 화면 좌우 = 화면 세로축 회전, 화면 상하 = 화면 가로축 회전
const vel = new THREE.Vector2(); let dragging = false, last = null, lastT = 0;
const camRight = new THREE.Vector3(), camUp = new THREE.Vector3(), qd = new THREE.Quaternion();
function rotateBy(dx, dy){
  camRight.setFromMatrixColumn(camera.matrixWorld, 0);
  camUp.setFromMatrixColumn(camera.matrixWorld, 1);
  qd.setFromAxisAngle(camUp, dx); drag.quaternion.premultiply(qd);
  qd.setFromAxisAngle(camRight, dy); drag.quaternion.premultiply(qd);
}
// 두 손가락 비틀기: 화면 안에서 지구를 돌림(화면 정면 축 회전)
let twA = 0, rimVel = 0, twT = 0;
const fwd = new THREE.Vector3();
function rotateRoll(da){ camera.getWorldDirection(fwd); qd.setFromAxisAngle(fwd, da); drag.quaternion.premultiply(qd); }
const pang = () => { const [a,b] = [...ptrs.values()]; return Math.atan2(b.y-a.y, b.x-a.x); };
// 두 손가락: 확대·축소 + 비틀기 회전
const ptrs = new Map(); let pinch0 = 0, dist0 = 0;
const pdist = () => { const [a,b] = [...ptrs.values()]; return Math.hypot(a.x-b.x, a.y-b.y); };
canvas.addEventListener('pointerdown', e => {
  tapDown = {id:e.pointerId, x:e.clientX, y:e.clientY, t:performance.now(), multi:ptrs.size > 0};
  if (focus) return;                                       // 확대 보기 중에는 누르기만 받음
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); canvas.setPointerCapture(e.pointerId);
  if (ptrs.size === 2){ dragging = false; pinch0 = pdist(); dist0 = camDist; twA = pang(); twT = performance.now(); rimVel = 0; vel.set(0,0); return; }
  dragging = true; last = {x:e.clientX, y:e.clientY}; lastT = performance.now(); vel.set(0,0); rimVel = 0;
  const h = document.getElementById('hint'); if (h) h.style.opacity = 0;
});
canvas.addEventListener('pointermove', e => {
  if (focus) return;
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 2 && pinch0 > 0){
    camDist = THREE.MathUtils.clamp(dist0 * Math.pow(pinch0 / pdist(), 0.7), 2.8, 10); placeCam();   // 손가락 간격 변화의 70%만 반영
    const a = pang(); let da = a - twA; da = Math.atan2(Math.sin(da), Math.cos(da)); twA = a;
    da *= 0.42;                                            // 비튼 각도의 42%만 돌림(너무 빠르지 않게)
    rotateRoll(da);                                        // 손가락이 비틀린 방향(시계/반시계) 그대로
    const now = performance.now(), dt = Math.max(1, now - twT) / 1000; rimVel = rimVel*0.5 + (da/dt)*0.5; twT = now;
    return;
  }
  if (!dragging) return;
  const k = 2.6 / Math.min(innerWidth, innerHeight);
  const dx = (e.clientX - last.x) * k, dy = (e.clientY - last.y) * k;
  rotateBy(dx, dy);
  const now = performance.now(), dt = Math.max(1, now - lastT) / 1000;
  vel.set(dx/dt, dy/dt).multiplyScalar(0.5).add(vel.clone().multiplyScalar(0.5));
  last = {x:e.clientX, y:e.clientY}; lastT = now;
});
const endDrag = e => {
  ptrs.delete(e.pointerId);
  // 짧게 누름(움직임 10px 미만, 0.4초 미만, 한 손가락): 천문대에 맞으면 → 확대 보기, 확대 중이면 → 콘텐츠 열기
  const td = tapDown; tapDown = null;
  if (e.type === 'pointerup' && td && td.id === e.pointerId && !td.multi && ptrs.size === 0 && performance.now() - td.t < 400
      && Math.hypot(e.clientX - td.x, e.clientY - td.y) < 10 && !camAnim && hitObs(e.clientX, e.clientY)){
    if (focus) openUni(); else focusObs();
  }
  if (ptrs.size < 2) pinch0 = 0; if (performance.now() - lastT > 80) vel.set(0,0); if (performance.now() - twT > 80) rimVel = 0; dragging = false; };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', e => { e.preventDefault(); if (focus) return; camDist = THREE.MathUtils.clamp(camDist * Math.exp(e.deltaY*0.0007), 2.8, 10); placeCam(); }, {passive:false});
function placeCam(){ const dir = CAM0.clone().sub(TARGET).normalize(); camera.position.copy(TARGET).addScaledVector(dir, camDist); camera.lookAt(TARGET); applyPR(); }

// 천문대 확대 보기: 지구 회전을 멈추고 카메라를 천문대 앞쪽 비스듬한 위(쿼터뷰)로 옮김. "← 지구로"·뒤로가기로 복귀
let focus = false, camAnim = null, tapDown = null, savedSpeed = 0, uniOpen = false;
const camLook = TARGET.clone(), ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hitObs(x, y){
  if (!landG.visible) return false;
  ndc.set(x/innerWidth*2 - 1, -(y/innerHeight)*2 + 1); ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects([obsHit, globe], false);
  return h.length > 0 && h[0].object === obsHit;           // 지구 뒤편에 가려진 천문대는 제외
}
function obsPose(){   // 천문대 확대 보기: 문 정면에서 22° 위로 내려다봄, 망원경(문 기준 오른쪽 45°)이 화면 오른쪽 위를 향함
  scene.updateMatrixWorld();
  const P = latLonToLocal(OB.lat, OB.lon, 1 + DISP).applyMatrix4(globe.matrixWorld), n = P.clone().normalize();
  const F = latLonToLocal(OB.to[0], OB.to[1], 1 + DISP).applyMatrix4(globe.matrixWorld).sub(P); F.sub(n.clone().multiplyScalar(F.dot(n))).normalize();   // 문이 보는 방향
  const X = new THREE.Vector3().crossVectors(n, F), a = THREE.MathUtils.degToRad(0), el = THREE.MathUtils.degToRad(22);   // X = 망원경 쪽(문을 마주 보면 오른쪽). 문 정면에서 보면 관측 틈·렌즈가 오른쪽에 보임(원본 그림 구도)
  const dir = F.clone().multiplyScalar(Math.cos(a)).addScaledVector(X, Math.sin(a)).multiplyScalar(Math.cos(el)).addScaledVector(n, Math.sin(el));
  const d = innerWidth/innerHeight < 1 ? 0.55 : 0.35;     // 세로 화면이면 조금 멀리
  return {pos: P.clone().addScaledVector(dir, d), look: P.clone().addScaledVector(n, 0.038), up: n};
}
function camTo(pose, dur, done){
  camAnim = {t:0, dur, p0:camera.position.clone(), p1:pose.pos, l0:camLook.clone(), l1:pose.look, u0:camera.up.clone(), u1:pose.up, done};
}
function stepCam(dt){
  if (!camAnim) return;
  const c = camAnim; c.t = Math.min(1, c.t + dt/c.dur);
  const k = c.t < 0.5 ? 4*c.t*c.t*c.t : 1 - Math.pow(-2*c.t + 2, 3)/2;      // 천천히 출발·천천히 도착
  const r = THREE.MathUtils.lerp(c.p0.length(), c.p1.length(), k);           // 지구를 뚫지 않게 거리는 따로 보간
  camera.position.lerpVectors(c.p0, c.p1, k).setLength(Math.max(r, 1.08));
  camLook.lerpVectors(c.l0, c.l1, k); camera.up.lerpVectors(c.u0, c.u1, k).normalize(); camera.lookAt(camLook);
  if (c.t >= 1){ camAnim = null; c.done && c.done(); }
}
function focusObs(){
  if (focus) return;
  focus = true; savedSpeed = speed; speed = 0; vel.set(0,0); rimVel = 0; dragging = false; ptrs.clear(); pinch0 = 0;
  document.body.classList.add('focus'); clouds.visible = false;
  renderer.setPixelRatio(Math.max(1, BASE_PR*0.88)); renderer.setSize(innerWidth, innerHeight, false); curPR = -1;   // 화면을 꽉 채우므로 해상도 조금 낮춤
  camTo(obsPose(), 1.3);
}
function unfocusObs(){
  if (!focus) return;
  const dir = CAM0.clone().sub(TARGET).normalize();
  camTo({pos: TARGET.clone().addScaledVector(dir, camDist), look: TARGET.clone(), up: new THREE.Vector3(0,1,0)}, 1.0, () => {
    focus = false; speed = savedSpeed; document.body.classList.remove('focus'); clouds.visible = $('clouds').checked;
    camera.up.set(0,1,0); camLook.copy(TARGET); placeCam();
  });
}
$('obsTag').onclick = () => focusObs();
$('focusBack').onclick = () => unfocusObs();
// 우주 천문대 콘텐츠: 화면 위 전체 창(iframe). 열려 있는 동안 지구 그리기를 멈춤, 닫으면 창을 지워 메모리 반환
// 콘텐츠: 웹으로 다시 만든 우주 천문대(web/universe). 앱에서는 WebViewAssetLoader 주소(https, WebGL 텍스처·fetch 허용), PC 점검은 상대 경로
// (이전: 원본 유니티 웹 빌드 https://koominchul.github.io/webgl_test/build_universeWeb/ — H092 에서 24~29fps)
const UNI_URL = location.protocol === 'file:' ? 'https://appassets.androidplatform.net/assets/universe/index.html' : '../../universe/index.html';
let uniDepth = 0;   // 콘텐츠 안 화면 깊이(0 목록, 1 행성 상세, 2 카드 팝업): 뒤로가기를 콘텐츠에 먼저 넘길지 판단
addEventListener('message', e => {
  const d = e.data; if (!d || !d.uni) return;
  if (d.uni === 'depth') uniDepth = d.depth;
  if (d.uni === 'exit') closeUni();
});
function openUni(){
  if (uniOpen) return;
  uniOpen = true; uniDepth = 0; const box = $('uni'); box.style.display = 'block'; box.querySelector('.msg').textContent = '우주 천문대 불러오는 중…';
  $('uniClose').style.display = 'none';                     // 콘텐츠에 나가기 버튼이 있음
  const f = document.createElement('iframe'); f.src = UNI_URL; f.allow = 'fullscreen; autoplay';
  f.onload = () => box.querySelector('.msg').textContent = '';
  box.insertBefore(f, $('uniClose'));
}
function closeUni(){
  if (!uniOpen) return;
  uniOpen = false; const box = $('uni'), f = box.querySelector('iframe');
  if (f){ f.src = 'about:blank'; f.remove(); }
  box.style.display = 'none'; clock.getDelta();
}
$('uniClose').onclick = () => closeUni();
// 앱 뒤로가기가 먼저 부름: 콘텐츠 창 → 닫기, 확대 보기 → 지구로, 아니면 false(앱이 지도로 돌아감)
window.__back = () => {
  if (uniOpen){ const f = $('uni').querySelector('iframe'); if (uniDepth > 0 && f){ f.contentWindow.postMessage({uni:'back'}, '*'); } else closeUni(); return true; } if (focus){ if (!camAnim) unfocusObs(); return true; } return false; };

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  camera.fov = w/h < 1 ? 42 : 30;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
// 말풍선: 천문대 꼭대기 위를 따라다님. 천문대가 지구 옆·뒤로 넘어가면 흐려지다 숨음, 확대 보기 중에는 숨김
const tagEl = document.getElementById('obsTag'), tagV = new THREE.Vector3(), tagN = new THREE.Vector3(), tagC = new THREE.Vector3();
let tagShown = false;
function placeTag(){
  let a = 0;
  if (!focus && landG.visible){
    tagV.copy(obsTop).applyMatrix4(globe.matrixWorld); tagN.copy(tagV).normalize();
    a = THREE.MathUtils.smoothstep(tagN.dot(tagC.copy(camera.position).sub(tagV).normalize()), 0.12, 0.35);   // 정면을 볼수록 1
  }
  if (a <= 0.01){ if (tagShown){ tagEl.style.display = 'none'; tagShown = false; } return; }
  tagV.project(camera);
  const x = (tagV.x + 1)/2*innerWidth, y = (1 - tagV.y)/2*innerHeight;
  if (!tagShown){ tagEl.style.display = 'block'; tagShown = true; }
  tagEl.style.left = x.toFixed(1) + 'px'; tagEl.style.top = (y - 6).toFixed(1) + 'px'; tagEl.style.opacity = a.toFixed(2);
  tagEl.style.pointerEvents = a > 0.5 ? 'auto' : 'none';
  if (a > 0.5 && !window.__tagT) window.__tagT = performance.now();   // 점검용: 말풍선이 처음 또렷해진 시각
}
const tmp = new THREE.Vector3(), nm = new THREE.Matrix3();
let cloudT = 0, fpsN = 0, fpsT = performance.now();
const fpsEl = document.getElementById('fps');
// 프레임 상한 자동: 화면 갱신 속도를 재서 60 이하이면서 갱신 속도를 나눠떨어뜨리는 가장 큰 값(90Hz→45, 60Hz→60, 120Hz→60, 144Hz→48)
// — 나눠떨어지지 않으면 간격이 번갈아 달라져 끊겨 보임(H092 90Hz 에서 60 상한이면 11·22ms 반반). 재는 동안은 45
let FRAME_MS = 1000/45;
(function probe(){
  const ts = []; const f = t => { ts.push(t); if (ts.length < 40) return requestAnimationFrame(f);
    const g = []; for (let i = 1; i < ts.length; i++) g.push(ts[i] - ts[i-1]); g.sort((x, y) => x - y);
    const hz = Math.round(1000 / g[g.length >> 1]), cap = hz / Math.ceil(hz / 60);
    FRAME_MS = 1000 / cap; acc = 0; window.__cap = {refreshHz: hz, cap: +cap.toFixed(1)}; };
  requestAnimationFrame(f);
})();
let lastNow = 0, acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (FRAME_MS > 0){   // 남은 시간을 쌓아 90/120Hz 화면에서도 상한에 맞춤(갱신 시각이 조금 흔들려도 간격이 고르게 판정에 여유)
    acc += now - lastNow; lastNow = now;
    if (acc < FRAME_MS*0.75) return;
    acc = Math.max(-FRAME_MS*0.5, Math.min(acc - FRAME_MS, FRAME_MS*0.5));
  } else lastNow = now;
  if (uniOpen){ clock.getDelta(); return; }
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!dragging){
    spin.rotation.y += dt * speed * 0.6;
    if (vel.lengthSq() > 1e-6){ rotateBy(vel.x*dt, vel.y*dt); vel.multiplyScalar(Math.pow(0.04, dt)); }
    if (Math.abs(rimVel) > 1e-3){ rotateRoll(rimVel*dt); rimVel *= Math.pow(0.003, dt); }   // 비틀기 관성은 짧게
  }
  cloudT += dt * (0.3 + speed);
  spinBlades(clock.elapsedTime);
  bobBoats(clock.elapsedTime);
  waddle(clock.elapsedTime);
  scene.updateMatrixWorld();
  globeMat.uniforms.uModel.value.copy(globe.matrixWorld);
  globeMat.uniforms.uTime.value = clock.elapsedTime;
  globeMat.uniforms.uZoom.value = THREE.MathUtils.smoothstep(2.6 - (camera.position.length() - 1.0), 0.0, 2.35);   // 지표면 높이 2.6(기본 4.6 근처는 0) → 0.25(천문대 확대 보기) 에서 1
  nm.setFromMatrix4(globe.matrixWorld);
  for (const p of propList){
    p.mesh.material.uniforms.uBase.value.copy(p.local).applyMatrix4(globe.matrixWorld);
    p.mesh.material.uniforms.uNormal.value.copy(p.nLocal).applyMatrix3(nm).normalize();
  }
  for (const c of clouds.children){
    const d = c.userData, a = d.a + cloudT*d.sp;
    c.position.set(Math.sin(a)*d.r, d.y, Math.cos(a)*d.r);
  }
  stepCam(dt);
  placeTag();
  renderer.render(scene, camera);
  fpsN++; const fnow = performance.now();
  if (fnow - fpsT >= 500){ fpsEl.textContent = Math.round(fpsN*1000/(fnow-fpsT)) + ' fps'; fpsN = 0; fpsT = fnow; }
}
requestAnimationFrame(frame);
document.getElementById('load').remove();
// 점검용: __look(위도, 경도, 카메라 거리, 위로 비켜 보기, 둘레 회전°) → 자동 회전을 멈추고 그 자리를 정면에 둠
window.__look = (lat, lon, d=3.2, k=0.6, az=0) => {
  speed = 0; vel.set(0,0); rimVel = 0; drag.quaternion.identity(); camDist = d; placeCam(); scene.updateMatrixWorld();
  const w = latLonToLocal(lat, lon, 1).applyMatrix4(globe.matrixWorld).normalize();
  const nN = latLonToLocal(Math.min(89.9, lat+1), lon, 1).applyMatrix4(globe.matrixWorld).normalize();   // 북쪽 방향
  const c = camera.position.clone().sub(TARGET).normalize().add(new THREE.Vector3(0,k,0)).normalize();
  const tan = (v, n) => v.clone().sub(n.clone().multiplyScalar(v.dot(n))).normalize();
  const basis = (n, t) => new THREE.Matrix4().makeBasis(n, t, new THREE.Vector3().crossVectors(n, t));
  const src = basis(w, tan(nN, w)), dst = basis(c, tan(new THREE.Vector3(0,1,0), c));   // 그 자리 = 정면, 북쪽 = 화면 위
  drag.quaternion.setFromRotationMatrix(dst.multiply(src.transpose())).premultiply(new THREE.Quaternion().setFromAxisAngle(c, THREE.MathUtils.degToRad(az)));
};
// 점검용: __cam(위도, 경도, 방위°(0=남쪽에서 북쪽을 봄), 올려본 각°, 거리) → 그 자리 둘레에 카메라를 직접 둠(다음 조작 때 원래대로)
window.__cam = (lat, lon, az=0, el=30, d=0.35) => {
  speed = 0; vel.set(0,0); rimVel = 0; scene.updateMatrixWorld();
  const P = latLonToLocal(lat, lon, 1 + DISP).applyMatrix4(globe.matrixWorld), n = P.clone().normalize();
  const N = latLonToLocal(Math.min(89.9, lat+1), lon, 1 + DISP).applyMatrix4(globe.matrixWorld).sub(P); N.sub(n.clone().multiplyScalar(N.dot(n))).normalize();
  const E = new THREE.Vector3().crossVectors(N, n), a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
  const dir = N.clone().multiplyScalar(-Math.cos(a)).addScaledVector(E, Math.sin(a)).multiplyScalar(Math.cos(e)).addScaledVector(n, Math.sin(e));
  camera.position.copy(P).addScaledVector(dir, d); camera.up.copy(n); camera.lookAt(P.clone().addScaledVector(n, 0.035)); camera.up.set(0,1,0);
};
window.__ready = true; window.__readyT = performance.now();
})();
</script>
