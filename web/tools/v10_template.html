<title>위티버스 월드맵 라이브 2D v10</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#050a18}
#gl{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#back{position:fixed;left:24px;top:20px;height:60px;padding:0 24px 0 10px;display:flex;align-items:center;gap:10px;border-radius:999px;border:2px solid rgba(255,255,255,.9);color:#fff;font:900 20px "Pretendard","Malgun Gothic",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.35);background:linear-gradient(135deg,#4fb3ff,#2a7fe0);transition:opacity .35s,background .8s,transform .15s;-webkit-tap-highlight-color:transparent}#exit{position:fixed;left:24px;top:20px;height:60px;padding:0 24px 0 10px;display:flex;align-items:center;gap:10px;border-radius:999px;border:2px solid rgba(255,255,255,.9);color:#fff;font:900 20px "Pretendard","Malgun Gothic",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.35);background:linear-gradient(135deg,#4fb3ff,#2a7fe0);transition:opacity .35s,background .8s,transform .15s;-webkit-tap-highlight-color:transparent}#exit.night{background:linear-gradient(135deg,#2b2f7a,#141a45)}#exit:active{transform:scale(.94)}#exit .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22)}#exit .ic svg{width:24px;height:24px}#back.night{background:linear-gradient(135deg,#2b2f7a,#141a45)}#back:active{transform:scale(.94)}#back .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22)}#back .ic svg{width:24px;height:24px}
#ztitle{position:fixed;left:50%;top:22px;transform:translateX(-50%);padding:10px 30px;border-radius:999px;color:#fff;font:900 26px "Pretendard","Malgun Gothic",sans-serif;background:rgba(10,18,40,.55);border:2px solid rgba(255,255,255,.85);transition:opacity .35s}
#wx{position:fixed;right:24px;top:20px;height:60px;padding:0 22px 0 10px;display:flex;align-items:center;gap:10px;border-radius:999px;border:2px solid rgba(255,255,255,.9);color:#fff;font:900 20px "Pretendard","Malgun Gothic",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:opacity .35s,background .8s,transform .15s;-webkit-tap-highlight-color:transparent}
#wx.day{background:linear-gradient(135deg,#4fb3ff,#2a7fe0)}
#wx.night{background:linear-gradient(135deg,#2b2f7a,#141a45)}
#wx:active{transform:scale(.94)}
#wx .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.22);transition:transform .8s}
#wx.night .ic{transform:rotate(-360deg)}
.hide{opacity:0!important;pointer-events:none!important}
#s3d{position:fixed;right:24px;top:98px;height:52px;padding:0 20px 0 12px;display:flex;align-items:center;gap:8px;border-radius:999px;border:2px dashed rgba(255,255,255,.85);color:#fff;font:800 18px "Pretendard","Malgun Gothic",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.35);background:linear-gradient(135deg,#8b5cf6,#5b3fd0);transition:opacity .35s;-webkit-tap-highlight-color:transparent;z-index:5}
/*__BUBFONT__*/
#cast{position:fixed;left:0;top:0;pointer-events:none;overflow:hidden}
#cast .ch{position:absolute;will-change:transform}
#cast .ch img{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform}
#cast .bub{position:absolute;padding:.62em 1.15em .58em;border-radius:1.3em;background:linear-gradient(180deg,#ffffff 0%,#f4f0ff 100%);color:#2b2552;font-weight:800;letter-spacing:-.01em;white-space:nowrap;font-family:"MwBubble","Pretendard","Malgun Gothic",sans-serif;font-size:1.05em;border:.15em solid var(--bc);filter:drop-shadow(0 .22em 0 var(--bs)) drop-shadow(0 .45em .7em rgba(0,0,20,.4))}
#cast .bub.l{--bc:#ff9b8f;--bs:#d9675f}
#cast .bub.r{--bc:#a593ff;--bs:#6b58d8}
#cast .bub::after{content:"";position:absolute;bottom:-.5em;width:.8em;height:.8em;background:#f4f0ff;border:solid var(--bc);border-width:0 .15em .15em 0;border-bottom-right-radius:.18em;transform:rotate(45deg);clip-path:polygon(100% -20%,100% 100%,-20% 100%)}
#cast .bub.l::after{left:var(--tx);margin-left:-.48em}
#cast .bub.r::after{right:var(--tx);margin-right:-.48em}
#cast .bub::before{content:attr(data-name);position:absolute;top:-.95em;padding:.18em .75em .14em;border-radius:1em;background:var(--bc);color:#fff;font-size:.6em;font-weight:800;letter-spacing:.04em;box-shadow:0 .15em 0 var(--bs)}
#cast .bub.l::before{left:.9em}
#cast .bub.r::before{right:.9em}
#hud{position:fixed;right:12px;bottom:10px;color:#8ff7a7;font:700 12px ui-monospace,monospace;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:8px}
